<!DOCTYPE html>
<html>
	<head>
		<script type="text/javascript" src="/static/paper-full.js"></script>
		<script type="text/javascript" src="/static/index.js"></script>
		<link href="/static/index.css" rel="stylesheet"/>
	</head>
	<body>
			<canvas id="myCanvas" resize></canvas><br/>

			<!-- Colour select -->
			<select id="colour-select" name="colour">
				<option value="black"/>Black</option>
				<option value="red"/>Red</option>
			</select>

			<!-- Tool select -->
			<a href="#" onclick="tool1.activate();">Lines</a>
			<a href="#" onclick="tool2.activate();">Clouds</a>

			<form action="/submit-part" method="POST" enctype="multipart/form-data">
				<input type="hidden" value="{{game_id}}" name="game_id"/>
				<input type="hidden" value="{{part_id}}" name="part_id"/>
				<input style="display:none" id="image" name="part" onsubmit="myCanvas"/>
				<input value="SUBMIT" type="submit"/>
			</form>
	</body>
</html>
