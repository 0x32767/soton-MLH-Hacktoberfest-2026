<!DOCTYPE html>
<html>
	<head>
		<link href="/static/index.css" rel="stylesheet"/>
		<link href="/static/technical.css" rel="stylesheet"/>
	</head>
	<body>
		<h1 id="part_id">{{part_id}}</h1>
		<audio style="display:hidden" autoplay>
			<source src="/static/music/boo.mp3" type="audio/mp3">
		</audio>
		<img style="display:none" id="pumpkin" src="/static/spooky/pumpkin.png" />
		<img style="display:none" id="web" src="/static/spooky/spiderweb.png" />
		<img style="display:none" id="skull" src="/static/spooky/skull.png" />

		<div id="grid">
			<div id="drawing">
				<img id="previous-overlap" src="data:image/png;base64,{{data}}" />
				<canvas id="myCanvas" resize></canvas>
			</div>

			<div id="buttons">
				<!-- Colour select -->
				<label>Colour</label><br/>
				<select id="colour-select" name="colour">
					<option value="black" selected/>Black</option>
					<option value="red"/>Red</option>
					<option value="orange"/>Orange</option>
					<option value="yellow"/>Yellow</option>
					<option value="green"/>Green</option>
					<option value="cyan"/>Cyan</option>
					<option value="blue"/>Blue</option>
					<option value="purple"/>Purple</option>
				</select><br/><br/>
				<label>Line Width</label><br/><input type="range" id="width-select" value="10" range max="50" min="1">
				<br/>
				<!-- Tool select -->
				<button onclick="tool1.activate();">Lines <img src="/static/images/pen.png" class="label-image" /></button><br/>
				<button onclick="tool2.activate();">Clouds <img src="/static/images/cloud.png" class="label-image" /></button><br/>
				<button onclick="tool3.activate();">Circle <img src="/static/images/circle.png" class="label-image" /></button><br/>
				<button onclick="tool4.activate();">Square <img src="/static/images/square.png" class="label-image" /></button><br/>
				<button onclick="tool5.activate();">Pumpkin <img src="/static/spooky/pumpkin.png" class="label-image" /></button><br/>
				<button onclick="tool6.activate();">Web <img src="/static/spooky/spiderweb.png" class="label-image" /></button><br/>
				<button onclick="tool7.activate();">Skull <img src="/static/spooky/skull.png" class="label-image" /></button><br/>
				<br/>

				<form action="/submit-part" method="POST" enctype="multipart/form-data" onsubmit="submit_canvas()">
					<input value="SUBMIT" type="submit"/>
					<input type="hidden" value="{{game_id}}" name="game_id"/>
					<input type="hidden" value="{{part_id}}" name="part_id"/>
					<input style="display:none" id="image" name="part"/>
				</form>
			</div>
		</div>
		<script type="text/javascript" src="/static/paper-full.js"></script>
		<script type="text/javascript" src="/static/index.js"></script>
	</body>
</html>
