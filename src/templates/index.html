<!DOCTYPE html>
<html>
	<head>
		<link href="/static/index.css" rel="stylesheet"/>
	</head>
	<body>
		<span id="part_id">{{part_id}}</span>

		<div id="grid">
			<canvas id="myCanvas" resize></canvas>

			<div id="buttons">
				<!-- Colour select -->
				<label>Colour</label><br/>
				<select id="colour-select" name="colour">
					<option value="black" selected/>Black</option>
					<option value="red"/>Red</option>
					<option value="orange"/>Orange</option>
					<option value="yellow"/>Yellow</option>
					<option value="green"/>Green</option>
					<option value="cyan"/>Cyan</option>
					<option value="blue"/>Blue</option>
					<option value="purple"/>Purple</option>
				</select><br/><br/>
				<label>Line Width</label><br/><input type="range" id="width-select" value="2"range max="20" min="1">
				<br/>
				<!-- Tool select -->
				<button onclick="tool1.activate();">Lines</button><br/>
				<button onclick="tool2.activate();">Clouds</button><br/>
				<button onclick="tool3.activate();">Circle</button><br/>
				<br/>

				<form action="/submit-part" method="POST" enctype="multipart/form-data" onsubmit="submit_canvas()">
					<input value="SUBMIT" type="submit"/>
					<input type="hidden" value="{{game_id}}" name="game_id"/>
					<input type="hidden" value="{{part_id}}" name="part_id"/>
					<input style="display:none" id="image" name="part"/>
				</form>
			</div>
		</div>
		<script type="text/javascript" src="/static/paper-full.js"></script>
		<script type="text/javascript" src="/static/index.js"></script>
	</body>
</html>
